/* rete P2P (WebRTC via PeerJS): il primo che entra in una stanza fa da hub, gli altri si collegano a lui */
const RN=(location.hash.slice(1)||"arena").toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,30)||"arena";
const Net=(()=>{

      c.on("data",m=>{if(!m)return;if(m.t==="snap"){for(const k in m.all)if(k!==id)pre[k]=m.all[k]}else if(m.t==="p"&&m.id!==id)merge(m.id,m.patch);else if(m.t==="l")delete pre[m.id];emit()});
      c.on("close",()=>{if(ok)lost()})});
    p.on("error",e=>{if(!ok){clearTimeout(to);rej(e)}else lost()})})}
  function lost(){reset();emit();lostCb&&lostCb()}
  return{
    start(room){const hubId="neonarena-v1-"+room;return new Promise((res,rej)=>{
      const p=new Peer(hubId);let ok=false;
      p.on("open",id=>{ok=true;peer=p;isHub=true;myId=id;pre={};pre[id]=Object.assign({},mine);hubSetup(p);res()});
      p.on("error",e=>{if(ok)return;try{p.destroy()}catch(x){}if(e.type==="unavailable-id")asClient(hubId).then(res,rej);else rej(e)})})},
    presence(pt){for(const k in pt){if(pt[k]===null)delete mine[k];else mine[k]=pt[k]}if(myId){merge(myId,pt);if(isHub)bcast({t:"p",id:myId,patch:pt});else if(hub&&hub.open)hub.send({t:"p",patch:pt});emit()}return Promise.resolve()},
    onPeers(h){handler=h;return()=>{}},onLost(f){lostCb=f},reset,
    peers(){return Object.keys(pre).map(id=>({peer:id,isMe:id===myId,presence:pre[id]}))},id(){return myId}}
})();
let colorTimer=null;
async function connect(){
  try{await Promise.race([Net.start(RN),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),12000))])}
  catch(e){Net.reset();room=null;addBots();setTimeout(connect,6000);return}
  room=Net;me=Net.id();
  const used=new Set(Net.peers().filter(p=>!p.isMe).map(p=>p.presence&&p.presence.c));for(let i=0;i<COL.length;i++){if(!used.has(i)){myC=i;break}}
  [...av.keys()].forEach(rmAv);
  Net.onPeers(onPeers);Net.onLost(()=>{room=null;lostAt=performance.now();[...av.keys()].forEach(rmAv);addBots();setTimeout(connect,400+Math.random()*1800)});
  pres({c:myC,p:[0,1.6,0],y:0,t:0,n:myName,h:hp,d:deaths,s:kills,hc:0,kb:["",0],sh:[0,[],0,0,0,0,0,0,0]});pk="";
  clearInterval(colorTimer);colorTimer=setInterval(()=>{if(!room)return;const o=Net.peers().filter(p=>!p.isMe&&p.presence&&p.presence.c===myC&&p.peer<me);if(o.length){const u=new Set(Net.peers().map(p=>p.presence&&p.presence.c));for(let i=0;i<COL.length;i++){if(!u.has(i)){myC=i;pres({c:i});break}}}},1000);
}

/* controlli */
const KM={KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1],KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0]};
function kupd(){mvK.x=mvK.z=0;for(const c in keys){if(keys[c]&&KM[c]){mvK.x+=KM[c][0];mvK.z+=KM[c][1]}}}
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"){if(e.code==="Enter"||e.code==="NumpadEnter")$("go").click();return}
  if(e.code==="Space"){firing=true;e.preventDefault()}else if(e.code==="KeyQ"||e.code==="KeyE")swap();else if(KM[e.code]){keys[e.code]=1;kupd()}});
addEventListener("keyup",e=>{if(e.target.tagName==="INPUT")return;if(e.code==="Space")firing=false;else if(KM[e.code]){keys[e.code]=0;kupd()}});
let dn=null;
addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.target.tagName==="CANVAS")dn={x:e.clientX,y:e.clientY,t:performance.now()}});
addEventListener("pointerup",e=>{if(dn&&e.pointerType==="mouse"&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<6&&performance.now()-dn.t<300)shoot($("camgun").querySelector(".gun"));dn=null});
document.addEventListener("DOMContentLoaded",()=>{
  document.querySelectorAll(".lg").forEach(i=>i.src=LOGO);$("nm").value=myName;
  const joy=$("joy"),knob=$("knob");let jid=null;
  function jm(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}knob.style.transform=`translate(calc(-50% + ${x*38}px), calc(-50% + ${y*38}px))`;mvJ.x=x;mvJ.z=y}
  joy.addEventListener("pointerdown",e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);jm(e)});
  joy.addEventListener("pointermove",e=>{if(e.pointerId===jid)jm(e)});
  const jup=e=>{if(e.pointerId===jid){jid=null;mvJ.x=mvJ.z=0;knob.style.transform="translate(-50%,-50%)"}};
  joy.addEventListener("pointerup",jup);joy.addEventListener("pointercancel",jup);
  const fb=$("fire");fb.addEventListener("pointerdown",e=>{e.preventDefault();ac();firing=true});
  ["pointerup","pointercancel","pointerleave"].forEach(n=>fb.addEventListener(n,()=>{firing=false}));
  $("sw").addEventListener("pointerdown",e=>{e.preventDefault();swap()});
  $("go").addEventListener("click",()=>{ac();myName=clean($("nm").value)||myName;try{localStorage.setItem("na_name",myName)}catch(e){}pres({n:myName});$("ov").style.display="none";if(ready)board()});
  const sc=document.querySelector("a-scene");sc.hasLoaded?boot():sc.addEventListener("loaded",boot);
});
</script>
<style>
:root{--bg:#04050d;--panel:rgba(8,12,30,.72);--tx:#e8f0ff;--mut:#8fa3d6;--ac:#00e5ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04050d;--panel:rgba(8,12,30,.72);--tx:#e8f0ff}}
:root[data-theme="dark"]{--bg:#04050d;--panel:rgba(8,12,30,.72);--tx:#e8f0ff}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.hud{position:fixed;z-index:5;pointer-events:none;font-size:13px}
.pn{background:var(--panel);border:1px solid rgba(0,229,255,.35);border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px)}
#lc{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:70vw}
#sb{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;min-width:140px}
.r{display:flex;align-items:center;gap:8px;padding:2px 0}.r i{width:12px;height:12px;border-radius:3px;display:inline-block}.r b{margin-left:auto;padding-left:14px}
#hpw{display:inline-block;width:90px;height:8px;background:#222;border-radius:4px;vertical-align:middle;overflow:hidden;margin-left:6px}#hpb{display:block;height:100%;width:100%;background:#7dff3a}
#wp div{padding:2px 0;display:flex;align-items:center;gap:6px}#wp img{width:26px;height:26px}
#sw{pointer-events:auto;display:none;padding:10px 16px;font-weight:800;letter-spacing:.06em;color:#04050d;background:linear-gradient(90deg,#ffe600,#ff2bd6);border:0;border-radius:999px;cursor:pointer;font-size:13px}
#toast{position:fixed;z-index:8;top:18%;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .25s;pointer-events:none;background:var(--panel);border:1px solid #ffe600;border-radius:12px;padding:10px 16px;font-weight:700;text-align:center}
#tkfx{position:fixed;z-index:9;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none;opacity:0;filter:drop-shadow(0 0 14px #ffe600)}
#tkfx.go{animation:tkpop 1.3s ease-out forwards}
@keyframes tkpop{0%{opacity:0;transform:perspective(400px) scale(.2) rotateY(0)}15%{opacity:1;transform:perspective(400px) scale(1.15) rotateY(180deg)}70%{opacity:1;transform:perspective(400px) scale(1) rotateY(1080deg)}100%{opacity:0;transform:perspective(400px) scale(.3) translateY(-60px) rotateY(1440deg)}}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:50%;transform:translateX(-50%);color:var(--mut);white-space:nowrap}
#cross{top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--ac);border-radius:50%;opacity:.9;transition:border-color .08s}
#cross:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:var(--ac);border-radius:50%}
.touch{display:none}
@media (pointer:coarse){.touch{display:block}#hint{display:none}}
#joy{position:fixed;z-index:6;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:130px;height:130px;border-radius:50%;background:rgba(0,229,255,.1);border:2px solid rgba(0,229,255,.5);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:rgba(0,229,255,.55);transform:translate(-50%,-50%)}
#fire{position:fixed;z-index:6;right:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:104px;height:104px;border-radius:50%;background:rgba(255,43,214,.3);border:2px solid #ff2bd6;color:#fff;font-weight:800;letter-spacing:.08em;touch-action:none;user-select:none;-webkit-user-select:none}
#fire:active{background:rgba(255,43,214,.7)}
#ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#10163a,var(--bg) 70%);padding:20px;overflow:auto}
#ov .c{max-width:440px;text-align:center}
#ov .lg{width:84px;height:84px}
#ov h1{margin:0 0 6px;font-size:40px;letter-spacing:.12em;background:linear-gradient(90deg,#00e5ff,#ff2bd6);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov p{color:var(--mut);line-height:1.5;margin:8px 0;font-size:14px}
#nm{width:100%;max-width:260px;box-sizing:border-box;margin-top:6px;padding:12px 14px;font-size:18px;text-align:center;color:var(--tx);background:rgba(255,255,255,.07);border:2px solid var(--ac);border-radius:12px;outline:none}
#go{margin-top:14px;padding:14px 38px;font-size:17px;font-weight:700;letter-spacing:.1em;color:#04050d;background:linear-gradient(90deg,#00e5ff,#ff2bd6);border:0;border-radius:999px;cursor:pointer}
</style>
</head>
<body>
<a-scene gameloop renderer="antialias:true" loading-screen="dotsColor:#00e5ff;backgroundColor:#04050d" fog="type:exponential;color:#070a1a;density:0.022">
  <a-sky color="#04050d"></a-sky>
  <a-plane gridfloor rotation="-90 0 0" width="37" height="37" material="color:#fff;roughness:.55;metalness:.35"></a-plane>

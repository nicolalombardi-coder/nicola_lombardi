<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Presepe.exe · VR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Presepe in realtà virtuale: personaggi realistici, animazioni e firma incisa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#10121a; }
  .intro {
    position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:24px;
    color:#f7edda; text-align:center; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(195,133,66,.22), transparent 34%),
      radial-gradient(ellipse at 50% 110%, rgba(104,67,42,.28), transparent 55%),
      linear-gradient(145deg, #10131d 0%, #171923 48%, #0b0d14 100%);
    transition: opacity 1s ease, visibility 1s ease;
  }
  .intro::before, .intro::after { content:""; position:absolute; inset:0; pointer-events:none; }
  .intro::before {
    opacity:.55; background-image:
      radial-gradient(1px 1px at 8% 17%, #fff 98%, transparent),
      radial-gradient(1px 1px at 19% 72%, #f5d8a0 98%, transparent),
      radial-gradient(1.5px 1.5px at 31% 22%, #fff 98%, transparent),
      radial-gradient(1px 1px at 76% 16%, #fff 98%, transparent),
      radial-gradient(1px 1px at 88% 64%, #f5d8a0 98%, transparent),
      radial-gradient(1px 1px at 65% 82%, #fff 98%, transparent),
      radial-gradient(1px 1px at 43% 91%, #fff 98%, transparent);
  }
  .intro::after {
    inset:18px; border:1px solid rgba(225,190,129,.18);
    box-shadow:inset 0 0 70px rgba(0,0,0,.16);
  }
  .intro.hide { opacity:0; visibility:hidden; }
  .intro-panel {
    position:relative; z-index:1; width:min(540px,92vw); box-sizing:border-box;
    padding:clamp(25px,5vw,48px) clamp(22px,5vw,54px) 38px;
    border:1px solid rgba(229,194,139,.28); border-radius:3px;
    background:linear-gradient(155deg, rgba(35,34,35,.78), rgba(17,19,27,.72));
    box-shadow:0 28px 90px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(14px);
  }
  .intro-kicker {
    margin-bottom:14px; font:600 10px/1.4 "Space Grotesk", sans-serif;
    letter-spacing:.42em; color:#d8b77e;
  }
  .logo-frame {
    width:clamp(164px,34vw,226px); aspect-ratio:1; margin:0 auto 18px;
    display:grid; place-items:center; position:relative;
  }
  .logo-frame::before {
    content:""; position:absolute; inset:5%; border:1px solid rgba(226,190,129,.36);
    border-radius:50%; box-shadow:0 0 42px rgba(213,157,75,.12);
  }
  .school-logo {
    display:block; width:88%; height:88%; object-fit:contain;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.34));
  }
  .intro h1 {
    margin:0; color:#f3dfba;
    font:600 clamp(30px,6vw,48px)/1.08 "Space Grotesk", Georgia, serif;
    letter-spacing:-.045em; text-shadow:0 3px 24px rgba(219,174,103,.18);
  }
  .intro-subtitle {
    margin-top:13px; color:#d8c6a6; font:600 11px/1.5 "Space Grotesk", sans-serif;
    letter-spacing:.24em;
  }
  .intro-dot { padding:0 8px; color:#c99b58; }
  .intro-rule { display:flex; justify-content:center; margin:24px 0 25px; }
  .intro-rule span { width:76px; height:1px; background:linear-gradient(90deg, transparent, #c99b58, transparent); }
  .intro button {
    display:inline-flex; align-items:center; justify-content:center; gap:22px;
    min-width:238px; padding:15px 23px; border:1px solid rgba(226,190,129,.72);
    border-radius:2px; background:linear-gradient(135deg, #b8874c, #8d6038);
    color:#fff7e9; font:600 12px "Space Grotesk", sans-serif; letter-spacing:.08em;
    cursor:pointer; box-shadow:0 9px 28px rgba(0,0,0,.28);
    transition:transform .25s, filter .25s, box-shadow .25s;
  }
  .intro button b { font-size:17px; font-weight:400; }
  .intro button:hover, .intro button:focus-visible {
    transform:translateY(-2px); filter:brightness(1.12);
    box-shadow:0 13px 32px rgba(0,0,0,.38); outline:none;
  }
</style>
<script>
const T = THREE, cache = {};

/* Materiali e forme 3D */
const std = (c, o = {}) => {
  const k = c + JSON.stringify(o);
  return cache[k] || (cache[k] = new T.MeshStandardMaterial(Object.assign({ color: c, roughness: .7 }, o)));
};
const tex = (c, kind) => {
  const k = kind + c;
  if (cache[k]) return cache[k];
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const x = cv.getContext('2d');
  x.fillStyle = c; x.fillRect(0, 0, 128, 128);
  if (kind === 'cloth') {
    for (let i = 0; i < 128; i += 2) {
      x.fillStyle = 'rgba(0,0,0,.09)'; x.fillRect(i, 0, 1, 128);
      x.fillStyle = 'rgba(255,255,255,.05)'; x.fillRect(0, i, 128, 1);
    }
  } else {
    for (let i = 0; i < 140; i++) {
      x.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.06)';
      x.beginPath(); x.arc(Math.random() * 128, Math.random() * 128, 2 + Math.random() * 9, 0, 6.3); x.fill();
    }
  }
  const t = new T.CanvasTexture(cv);
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.repeat.set(kind === 'cloth' ? 4 : 2, kind === 'cloth' ? 4 : 2);
  t.colorSpace = T.SRGBColorSpace;
  return cache[k] = new T.MeshStandardMaterial({ map: t, roughness: kind === 'cloth' ? .95 : .9, side: T.DoubleSide });
};

const M = (geo, mat, x = 0, y = 0, z = 0, sc) => {
  const m = new T.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (sc) m.scale.set(...sc);
  return m;
};

const gold = () => std('#ffd27a', { metalness: .9, roughness: .25, emissive: '#ffb300', emissiveIntensity: .45 });

const blob = r => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const x = cv.getContext('2d'), g = x.createRadialGradient(32, 32, 2, 32, 32, 32);
  g.addColorStop(0, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const m = new T.Mesh(new T.PlaneGeometry(r * 2, r * 2), new T.MeshBasicMaterial({ map: new T.CanvasTexture(cv), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = .015;
  return m;
};

const lathe = (pts, h, seg, ps, pl, fold) => {
  const g = new T.LatheGeometry(pts.map(p => new T.Vector2(p[0] * h, p[1] * h)), seg, ps, pl), P = g.attributes.position;
  for (let i = 0; i < P.count; i++) {
    const x = P.getX(i), y = P.getY(i) / h, z = P.getZ(i), k = 1 + fold * Math.sin(Math.atan2(x, z) * 9 + y * 6) * Math.min(1, (.95 - y) * 2.2);
    P.setX(i, x * k); P.setZ(i, z * k);
  }
  g.computeVertexNormals();
  return g;
};

/* Personaggio */
const POSE = {
  rest: [.06, -.25, .06, -.25, 0],
  pray: [-.35, -1.5, -.35, -1.5, .5],
  hold: [-.7, -1, -.7, -1, .3],
  staff: [-.55, -.5, .06, -.25, 0],
  cradle: [-.55, -1, -.55, -1, .35]
};

AFRAME.registerComponent('person', {
  schema: {
    robe: { default: '#7a3b2e' }, mantle: { default: '' }, skin: { default: '#e2b48a' }, hair: { default: '#3a2a1c' },
    h: { default: 1.7 }, pose: { default: 'rest' }, head: { default: 'none' }, hc: { default: '' },
    beard: { default: false }, halo: { default: false }, staff: { default: false }, gift: { default: false },
    trim: { default: false }, tilt: { default: 0 }
  },
  init() {
    const d = this.data, h = d.h, g = new T.Group(), sk = std(d.skin, { roughness: .55 }), rb = tex(d.robe, 'cloth'), hr = std(d.hair, { roughness: .9 });
    this.g = g; this.ph = Math.random() * 9;
    g.add(blob(h * .3));
    g.add(new T.Mesh(lathe([[.17, .03], [.16, .2], [.125, .42], [.095, .56], [.105, .68], [.13, .79], [.1, .84], [.045, .86]], h, 40, 0, 6.283, .04), rb));
    if (d.mantle) g.add(new T.Mesh(lathe([[.2, .06], [.19, .3], [.16, .55], [.15, .75], [.13, .83], [.1, .855]], h, 40, .7, 6.283 - 1.4, .06), tex(d.mantle, 'cloth')));
    const belt = M(new T.TorusGeometry(.1 * h, .009 * h, 8, 24), std('#3b2a1c'), 0, .57 * h, 0); belt.rotation.x = Math.PI / 2; g.add(belt);
    if (d.trim) { const t = M(new T.TorusGeometry(.17 * h, .007 * h, 6, 36), gold(), 0, .04 * h, 0); t.rotation.x = Math.PI / 2; g.add(t); }
    for (const s of [-1, 1]) g.add(M(new T.BoxGeometry(.05 * h, .02 * h, .1 * h), std('#4a3322'), s * .05 * h, .01 * h, .07 * h));
    g.add(M(new T.CylinderGeometry(.024 * h, .028 * h, .06 * h, 12), sk, 0, .875 * h, 0));

    /* Testa */
    const hd = new T.Group(), R = .062 * h; hd.position.y = .935 * h; hd.rotation.x = d.tilt; g.add(hd); this.hd = hd; this.tilt = d.tilt;
    hd.add(M(new T.SphereGeometry(R, 24, 18), sk, 0, 0, 0, [.88, 1.12, 1]));
    hd.add(M(new T.SphereGeometry(.012 * h, 10, 8), sk, 0, -.006 * h, R * .98, [.8, 1.3, 1.1]));
    for (const s of [-1, 1]) {
      hd.add(M(new T.SphereGeometry(.013 * h, 8, 6), sk, s * R * .88, 0, 0, [.4, 1, .8]));
      hd.add(M(new T.SphereGeometry(.0085 * h, 10, 8), std('#f2eee6'), s * .021 * h, .013 * h, .054 * h, [1, .8, .6]));
      hd.add(M(new T.SphereGeometry(.0052 * h, 8, 6), std('#241810', { roughness: .3 }), s * .021 * h, .013 * h, .0575 * h));
      hd.add(M(new T.BoxGeometry(.022 * h, .0035 * h, .005 * h), hr, s * .021 * h, .027 * h, .0555 * h));
    }
    hd.add(M(new T.BoxGeometry(.02 * h, .0035 * h, .004 * h), std('#8a4a42'), 0, -.03 * h, .055 * h));
    if (d.head === 'none' || d.head === 'crown') {
      const c = M(new T.SphereGeometry(R * 1.04, 24, 14, 0, 6.283, 0, 1.95), hr, 0, .004 * h, -.004 * h, [.9, 1.12, 1.04]);
      c.rotation.x = -.9; hd.add(c);
    }
    if (d.beard) {
      hd.add(M(new T.SphereGeometry(.052 * h, 16, 12), hr, 0, -.04 * h, .018 * h, [.9, 1.05, .85]));
      hd.add(M(new T.SphereGeometry(.02 * h, 10, 8), hr, 0, -.022 * h, .056 * h, [2, .45, .6]));
    }
    if (d.head === 'veil' || d.head === 'hood') hd.add(new T.Mesh(lathe([[.11, -.17], [.098, -.09], [.082, -.02], [.075, .03], [.05, .062], [.002, .072]], h, 32, .55, 6.283 - 1.1, .03), tex(d.hc || d.robe, 'cloth')));
    if (d.head === 'crown') {
      if (d.hc) for (const y of [.03, .05, .07]) {
        const t = M(new T.TorusGeometry(.064 * h, .02 * h, 8, 24), tex(d.hc, 'cloth'), 0, y * h, 0, [1, .6, 1]);
        t.rotation.x = Math.PI / 2; hd.add(t);
      }
      hd.add(M(new T.CylinderGeometry(.064 * h, .057 * h, .045 * h, 14, 1, true), gold(), 0, .068 * h, 0));
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * 6.283;
        hd.add(M(new T.ConeGeometry(.009 * h, .03 * h, 5), gold(), Math.sin(a) * .062 * h, .1 * h, Math.cos(a) * .062 * h));
      }
    }
    if (d.halo) {
      const hl = new T.Group(); hl.position.set(0, .012 * h, -.04 * h); hl.rotation.x = -.15;
      hl.add(new T.Mesh(new T.TorusGeometry(.1 * h, .004 * h, 8, 48), new T.MeshBasicMaterial({ color: 0xffd27a })));
      hl.add(new T.Mesh(new T.CircleGeometry(.1 * h, 40), new T.MeshBasicMaterial({ color: 0xffc24a, transparent: true, opacity: .22, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide })));
      hd.add(hl); this.halo = hl;
    }

    /* Braccia */
    const P = POSE[d.pose] || POSE.rest;
    for (const s of [1, -1]) {
      const a = new T.Group(); a.position.set(s * .125 * h, .79 * h, 0); a.rotation.order = 'YXZ'; a.rotation.set(s > 0 ? P[0] : P[2], -s * P[4], s * .07);
      a.add(M(new T.CapsuleGeometry(.027 * h, .116 * h, 6, 12), rb, 0, -.085 * h, 0));
      const e = new T.Group(); e.position.y = -.17 * h; e.rotation.x = s > 0 ? P[1] : P[3]; a.add(e);
      e.add(M(new T.CapsuleGeometry(.022 * h, .106 * h, 6, 12), rb, 0, -.075 * h, 0));
      e.add(M(new T.SphereGeometry(.021 * h, 12, 10), sk, 0, -.155 * h, 0, [.9, 1.1, .6]));
      g.add(a);
    }
    if (d.staff) {
      g.add(M(new T.CylinderGeometry(.012 * h, .015 * h, 1.15 * h, 8), std('#6b4a2b', { roughness: .9 }), .15 * h, .575 * h, .22 * h));
      g.add(M(new T.TorusGeometry(.05 * h, .011 * h, 8, 16, Math.PI), std('#6b4a2b', { roughness: .9 }), .1 * h, 1.15 * h, .22 * h));
    }
    if (d.gift) {
      g.add(M(new T.BoxGeometry(.09 * h, .05 * h, .065 * h), gold(), 0, .655 * h, .27 * h));
      g.add(M(new T.BoxGeometry(.095 * h, .018 * h, .07 * h), gold(), 0, .69 * h, .27 * h));
      g.add(M(new T.SphereGeometry(.011 * h, 10, 8), std('#c8102e', { roughness: .2, emissive: '#80001a', emissiveIntensity: .5 }), 0, .705 * h, .27 * h));
    }

    /* Dettagli anatomici */
    hd.add(M(new T.SphereGeometry(.012 * h, 16, 12), sk, 0, -.004 * h, .064 * h, [.72, 1.55, 1.05]));
    for (const s of [-1, 1]) {
      hd.add(M(new T.SphereGeometry(.014 * h, 14, 10), sk, s * .038 * h, -.012 * h, .035 * h, [1, .8, .45]));
      hd.add(M(new T.SphereGeometry(.014 * h, 12, 8), sk, s * .061 * h, -.002 * h, 0, [.45, 1.15, .7]));
      hd.add(M(new T.CapsuleGeometry(.004 * h, .018 * h, 4, 8), hr, s * .021 * h, .031 * h, .055 * h));
    }
    hd.add(M(new T.SphereGeometry(.008 * h, 12, 8), std('#8e5147', { roughness: .8 }), 0, -.033 * h, .054 * h, [1, .5, .45]));

    this.el.setObject3D('m', g);
  },
  tick(t) {
    const k = t / 1000 + this.ph;
    this.hd.rotation.set(this.tilt + Math.sin(k * .9) * .03, Math.sin(k * .6) * .14, 0);
    this.g.scale.y = 1 + .005 * Math.sin(k * 1.6);
    if (this.halo) this.halo.scale.setScalar(1 + .06 * Math.sin(k * 2.4));
  }
});

/* Bue e Asinello */
AFRAME.registerComponent('animal', {
  schema: { kind: { default: 'ox' } },
  init() {
    const ox = this.data.kind === 'ox', s = ox ? 1.15 : .95, hide = tex(ox ? '#7b4a2b' : '#8a8d97', 'hide'), pale = std(ox ? '#c9a27c' : '#d9d4c8', { roughness: .9 }), dk = std('#17110d', { roughness: .5 }), g = new T.Group();
    g.add(blob(.8 * s));
    const b = M(new T.CapsuleGeometry(.27 * s, .6 * s, 8, 16), hide, 0, .74 * s, 0); b.rotation.x = Math.PI / 2; g.add(b); this.b = b;
    for (const [x, z] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
      g.add(M(new T.CapsuleGeometry(.05 * s, .46 * s, 4, 8), hide, x * .17 * s, .3 * s, z * .34 * s));
      g.add(M(new T.CylinderGeometry(.05 * s, .055 * s, .05 * s, 8), dk, x * .17 * s, .03 * s, z * .34 * s));
    }
    const nk = new T.Group(); nk.position.set(0, .95 * s, .5 * s); g.add(nk); this.nk = nk;
    const neck = M(new T.CapsuleGeometry(.12 * s, .22 * s, 6, 10), hide, 0, .06 * s, .12 * s); neck.rotation.x = 1; nk.add(neck);
    const hh = new T.Group(); hh.position.set(0, .2 * s, .3 * s); hh.rotation.x = .5; nk.add(hh);
    hh.add(M(new T.SphereGeometry(.14 * s, 18, 14), hide, 0, 0, 0, [.8, .95, 1.25]));
    hh.add(M(new T.SphereGeometry(.085 * s, 14, 10), pale, 0, -.03 * s, .2 * s, [.9, .8, 1]));
    for (const x of [-1, 1]) {
      hh.add(M(new T.SphereGeometry(.014 * s, 8, 6), dk, x * .03 * s, -.02 * s, .28 * s));
      hh.add(M(new T.SphereGeometry(.018 * s, 10, 8), dk, x * .105 * s, .05 * s, .09 * s));
      if (ox) {
        const c = M(new T.ConeGeometry(.04 * s, .14 * s, 8), hide, x * .14 * s, .12 * s, -.03 * s); c.rotation.z = -x * 1.3; hh.add(c);
        const hn = M(new T.ConeGeometry(.025 * s, .22 * s, 8), std('#efe6cf', { roughness: .5 }), x * .15 * s, .2 * s, .02 * s); hn.rotation.z = -x * .9; hh.add(hn);
      } else {
        const e = M(new T.CapsuleGeometry(.035 * s, .2 * s, 4, 8), hide, x * .07 * s, .27 * s, -.02 * s); e.rotation.z = -x * .25; hh.add(e);
      }
    }
    const tl = new T.Group(); tl.position.set(0, .88 * s, -.62 * s);
    tl.add(M(new T.CapsuleGeometry(.015 * s, .32 * s, 4, 6), hide, 0, -.2 * s, 0));
    tl.add(M(new T.SphereGeometry(.04 * s, 8, 6), dk, 0, -.4 * s, 0)); g.add(tl); this.tl = tl;
    this.ph = Math.random() * 9; this.el.setObject3D('m', g);
  },
  tick(t) {
    const k = t / 1000 + this.ph;
    this.nk.rotation.x = Math.sin(k * .6) * .12;
    this.tl.rotation.z = Math.sin(k * 2) * .25;
    this.b.scale.set(1, 1 + .01 * Math.sin(k * 1.5), 1);
  }
});

/* Pecora */
AFRAME.registerComponent('sheep', {
  init() {
    const g = new T.Group();
    const wool = std('#eee8dc', { roughness: 1 }), woolHi = std('#fff8eb', { roughness: 1 });
    const face = std('#55463b', { roughness: .92 }), muzzle = std('#b99b85', { roughness: .9 });
    const hoof = std('#302a25', { roughness: .85 }), eye = std('#17130f', { roughness: .35 });
    const add = (geo, mat, x, y, z, scale) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); if (scale) m.scale.set(...scale); g.add(m); return m; };

    add(new T.SphereGeometry(1, 32, 24), wool, 0, .52, -.015, [.43, .39, .69]);
    add(new T.SphereGeometry(1, 24, 18), wool, 0, .39, .02, [.34, .24, .53]);
    for (let i = 0; i < 112; i++) {
      const u = Math.random() * Math.PI * 2, v = (Math.random() - .5) * Math.PI;
      const x = Math.cos(v) * Math.cos(u) * .405, y = .52 + Math.sin(v) * .355, z = -.015 + Math.cos(v) * Math.sin(u) * .645;
      const r = .045 + Math.random() * .025;
      const curl = add(new T.SphereGeometry(r, 10, 8), i % 5 === 0 ? woolHi : wool, x, y, z);
      curl.scale.set(1, .9, 1);
    }
    const neck = add(new T.CapsuleGeometry(.13, .28, 8, 16), wool, 0, .62, .49, [.85, 1, 1]); neck.rotation.x = -.42;
    const head = new T.Group(); head.position.set(0, .76, .68); g.add(head); this.head = head;
    const skull = new T.Mesh(new T.SphereGeometry(.155, 24, 18), face); skull.scale.set(.9, 1.05, 1.18); head.add(skull);
    const snout = new T.Mesh(new T.SphereGeometry(.092, 20, 14), muzzle); snout.position.set(0, -.065, .135); snout.scale.set(.82, .65, 1.15); head.add(snout);
    const nose = new T.Mesh(new T.SphereGeometry(.034, 16, 12), hoof); nose.position.set(0, -.045, .225); nose.scale.set(1, .7, .65); head.add(nose);
    for (const side of [-1, 1]) {
      const ear = new T.Mesh(new T.SphereGeometry(.075, 16, 12), face); ear.position.set(side * .17, .035, -.005); ear.scale.set(1.35, .48, .55); ear.rotation.z = side * -.18; head.add(ear);
      const inner = new T.Mesh(new T.SphereGeometry(.038, 12, 8), muzzle); inner.position.set(side * .19, .038, .018); inner.scale.set(1, .45, .5); head.add(inner);
      const socket = new T.Mesh(new T.SphereGeometry(.035, 12, 8), muzzle); socket.position.set(side * .105, .025, .115); head.add(socket);
      const pupil = new T.Mesh(new T.SphereGeometry(.018, 12, 8), eye); pupil.position.set(side * .11, .025, .145); head.add(pupil);
      const glint = new T.Mesh(new T.SphereGeometry(.006, 8, 6), woolHi); glint.position.set(side * .115, .034, .16); head.add(glint);
    }
    this.legs = [];
    for (const x of [-.245, .245]) for (const z of [-.43, .43]) {
      const leg = new T.Group(); leg.position.set(x, .35, z); g.add(leg); this.legs.push(leg);
      const upper = new T.Mesh(new T.CapsuleGeometry(.047, .19, 6, 10), wool); upper.position.y = -.045; leg.add(upper);
      const lower = new T.Mesh(new T.CylinderGeometry(.026, .035, .17, 10), face); lower.position.y = -.19; leg.add(lower);
      const foot = new T.Mesh(new T.BoxGeometry(.085, .065, .105), hoof); foot.position.set(0, -.285, .025); leg.add(foot);
    }
    const tail = new T.Group(); tail.position.set(0, .62, -.68); g.add(tail); this.tail = tail;
    const tailBall = new T.Mesh(new T.SphereGeometry(.085, 14, 10), woolHi); tailBall.scale.set(.8, 1.15, .8); tail.add(tailBall);
    this.el.setObject3D('m', g); this.phase = Math.random() * 8;
  },
  tick(t) {
    const k = t / 1000 + this.phase;
    const nibble = (Math.sin(k * 1.2) + 1) * .5;
    this.head.rotation.x = .05 + nibble * .34;
    this.head.rotation.z = Math.sin(k * .7) * .035;
    this.tail.rotation.x = Math.sin(k * 3) * .28;
    this.legs.forEach((leg, i) => { leg.rotation.x = Math.sin(k * 2.1 + i * Math.PI) * .035; });
  }
});

/* Gesù Bambino */
AFRAME.registerComponent('baby', {
  init() {
    const g = new T.Group(), c = tex('#f3ead8', 'cloth');
    const b = M(new T.CapsuleGeometry(.055, .13, 6, 12), c); b.rotation.z = Math.PI / 2; g.add(b);
    for (const x of [-.03, .05]) {
      const r = M(new T.TorusGeometry(.058, .007, 6, 16), std('#d9c8a3'), x, 0, 0);
      r.rotation.y = Math.PI / 2; g.add(r);
    }
    const sk = std('#f0c7a0', { roughness: .5 }); g.add(M(new T.SphereGeometry(.05, 16, 12), sk, -.15, .005, 0));
    for (const z of [-1, 1]) g.add(M(new T.BoxGeometry(.014, .003, .004), std('#5a3a2a'), -.15, .048, z * .02));
    g.add(M(new T.SphereGeometry(.007, 6, 6), sk, -.15, .05, 0));
    this.g = g; this.el.setObject3D('m', g);
  },
  tick(t) { this.g.scale.y = 1 + .03 * Math.sin(t / 700); }
});

/* Pellegrini */
AFRAME.registerComponent('pilgrim', {
  schema: { from: { type: 'vec3' }, to: { type: 'vec3' }, speed: { default: .4 } },
  init() {
    const f = this.data.from, t = this.data.to;
    this.u = 0; this.dir = 1; this.wait = 2000; this.yaw = 0;
    this.base = Math.atan2(t.x - f.x, t.z - f.z);
    this.len = Math.hypot(t.x - f.x, t.z - f.z);
  },
  tick(t, dt) {
    const d = this.data, o = this.el.object3D, c = this.el.firstElementChild && this.el.firstElementChild.object3D;
    let walk = false;
    if (this.wait > 0) this.wait -= dt;
    else {
      walk = true; this.u += this.dir * dt / 1000 * d.speed / this.len;
      if (this.u >= 1) { this.u = 1; this.dir = -1; this.wait = 9000; }
      else if (this.u <= 0) { this.u = 0; this.dir = 1; this.wait = 3000; }
    }
    const tg = this.base + (walk && this.dir < 0 ? Math.PI : 0), df = ((tg - this.yaw + Math.PI) % 6.283 + 6.283) % 6.283 - Math.PI;
    this.yaw += df * Math.min(1, dt * .004);
    o.position.set(d.from.x + (d.to.x - d.from.x) * this.u, 0, d.from.z + (d.to.z - d.from.z) * this.u);
    o.rotation.y = this.yaw;
    if (c) c.position.y = walk ? Math.abs(Math.sin(t / 190)) * .03 : 0;
  }
});

/* Firma incisa sul pavimento */
AFRAME.registerComponent('ground-signature', {
  init() {
    const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 1024, 256);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#d8ae68'; ctx.shadowBlur = 18;
    ctx.font = '600 94px Georgia,serif'; ctx.fillStyle = '#d8b77e';
    ctx.fillText('NICOLA LOMBARDI', 512, 128);
    ctx.shadowBlur = 0; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,238,198,.75)';
    ctx.strokeText('NICOLA LOMBARDI', 512, 128);
    const tex = new T.CanvasTexture(canvas); tex.colorSpace = T.SRGBColorSpace;
    const mat = new T.MeshBasicMaterial({ map: tex, transparent: true, opacity: .9, side: T.DoubleSide, depthWrite: false });
    const mesh = new T.Mesh(new T.PlaneGeometry(5.6, 1.4), mat);
    mesh.rotation.x = -Math.PI / 2; mesh.position.set(0, .055, 4.8);
    this.el.setObject3D('signature', mesh);
  }
});

/* Stella cometa */
AFRAME.registerComponent('comet-star', {
  schema: { scale: { default: 1 } },
  init() {
    const root = new T.Group(), s = this.data.scale; root.scale.setScalar(s);
    const goldMat = new T.MeshStandardMaterial({ color: 0xffdf9a, emissive: 0xffa72b, emissiveIntensity: 1.35, metalness: .25, roughness: .28 });
    const coreMat = new T.MeshBasicMaterial({ color: 0xfff8df });
    const shape = new T.Shape(), outer = .62, inner = .27;
    for (let i = 0; i < 16; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 8, r = i % 2 ? inner : outer, x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? shape.lineTo(x, y) : shape.moveTo(x, y);
    }
    shape.closePath();
    const starGeo = new T.ExtrudeGeometry(shape, { depth: .12, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: .045, bevelThickness: .045 });
    starGeo.center();
    const star = new T.Mesh(starGeo, goldMat); root.add(star);
    const core = new T.Mesh(new T.SphereGeometry(.16, 24, 18), coreMat); core.position.z = .11; root.add(core);
    const glow = new T.Mesh(new T.SphereGeometry(.38, 24, 18), new T.MeshBasicMaterial({ color: 0xffc65c, transparent: true, opacity: .18, blending: T.AdditiveBlending, depthWrite: false })); root.add(glow);
    const points = [new T.Vector3(.34, .18, -.04), new T.Vector3(.95, .52, -.08), new T.Vector3(1.75, .92, -.15), new T.Vector3(2.8, 1.28, -.22), new T.Vector3(4.05, 1.48, -.3)];
    const curve = new T.CatmullRomCurve3(points);
    const tailGeo = new T.TubeGeometry(curve, 64, .105, 10, false);
    const tail = new T.Mesh(tailGeo, new T.MeshBasicMaterial({ color: 0xffd98b, transparent: true, opacity: .78, blending: T.AdditiveBlending, depthWrite: false })); root.add(tail);
    const light = new T.PointLight(0xffc66e, 2.2, 24, 1.5); light.position.set(0, 0, .4); root.add(light);
    this.el.setObject3D('comet', root); this.root = root; this.glow = glow; this.tail = tail;
  },
  tick(t) {
    const k = t / 1000;
    this.root.rotation.z = Math.sin(k * .18) * .035;
    this.root.position.y = Math.sin(k * .55) * .12;
    this.glow.scale.setScalar(1 + .055 * Math.sin(k * 2.1));
    this.tail.material.opacity = .62 + .13 * Math.sin(k * 1.7);
  }
});

/* Cielo stellato */
AFRAME.registerComponent('starfield', {
  init() {
    const n = 1500, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const t = Math.random() * 6.283, u = Math.random() * .95 + .05, s = Math.sqrt(1 - u * u);
      p.set([Math.cos(t) * s * 250, u * 250, Math.sin(t) * s * 250], i * 3);
    }
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(p, 3));
    this.el.setObject3D('s', new T.Points(g, new T.PointsMaterial({ color: 0xffffff, size: 1.4, sizeAttenuation: false, fog: false })));
  }
});

/* Effetto sfarfallio per fiamme */
AFRAME.registerComponent('flicker', {
  schema: { base: { default: 1.2 }, amp: { default: .5 } },
  tick(t) {
    const l = this.el.components.light;
    if (l) l.light.intensity = this.data.base + Math.sin(t / 90) * this.data.amp * .5 + Math.sin(t / 37) * this.data.amp * .3 + Math.random() * this.data.amp * .2;
  }
});

/* Movimento JoyStick VR */
AFRAME.registerComponent('thumbstick-move', {
  init() {
    this.in = new T.Vector2(); this.q = new T.Quaternion();
    this.el.addEventListener('thumbstickmoved', e => this.in.set(e.detail.x, e.detail.y));
  },
  tick(t, dt) {
    if (this.in.length() < .15) return;
    const c = this.el.querySelector('[camera]'); if (!c) return;
    c.object3D.getWorldQuaternion(this.q);
    const yaw = new T.Euler().setFromQuaternion(this.q, 'YXZ').y, s = 2.2 * dt / 1000, p = this.el.object3D.position;
    p.x += (this.in.x * Math.cos(yaw) + this.in.y * Math.sin(yaw)) * s;
    p.z += (-this.in.x * Math.sin(yaw) + this.in.y * Math.cos(yaw)) * s;
  }
});

window.addEventListener('DOMContentLoaded', () => document.getElementById('start').addEventListener('click', () => document.getElementById('intro').classList.add('hide')));
</script>

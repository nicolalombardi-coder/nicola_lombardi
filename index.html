<script>
const mk=(p,t,a={})=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const T=THREE,cache={};

/* ---------- Utilità 3D: materiali procedurali, mesh, ombre, panneggi ---------- */
const std=(c,o={})=>{const k=c+JSON.stringify(o);return cache[k]||(cache[k]=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o)))};
const tex=(c,kind)=>{const k=kind+c;if(cache[k])return cache[k];
  const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');x.fillStyle=c;x.fillRect(0,0,128,128);
  if(kind==='cloth')for(let i=0;i<128;i+=2){x.fillStyle='rgba(0,0,0,.09)';x.fillRect(i,0,1,128);x.fillStyle='rgba(255,255,255,.05)';x.fillRect(0,i,128,1)}
  else for(let i=0;i<140;i++){x.fillStyle=Math.random()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.06)';x.beginPath();x.arc(Math.random()*128,Math.random()*128,2+Math.random()*9,0,6.3);x.fill()}
  const t=new T.CanvasTexture(cv);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(kind==='cloth'?4:2,kind==='cloth'?4:2);t.colorSpace=T.SRGBColorSpace;
  return cache[k]=new T.MeshStandardMaterial({map:t,roughness:kind==='cloth'?.95:.9,side:T.DoubleSide})};
const M=(geo,mat,x=0,y=0,z=0,sc)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);if(sc)m.scale.set(...sc);return m};
const gold=()=>std('#ffd27a',{metalness:.9,roughness:.25,emissive:'#ffb300',emissiveIntensity:.45});
const blob=r=>{const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,32);
  g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);
  const m=new T.Mesh(new T.PlaneGeometry(r*2,r*2),new T.MeshBasicMaterial({map:new T.CanvasTexture(cv),transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=.015;return m};
const lathe=(pts,h,seg,ps,pl,fold)=>{const g=new T.LatheGeometry(pts.map(p=>new T.Vector2(p[0]*h,p[1]*h)),seg,ps,pl),P=g.attributes.position;
  for(let i=0;i<P.count;i++){const x=P.getX(i),y=P.getY(i)/h,z=P.getZ(i),k=1+fold*Math.sin(Math.atan2(x,z)*9+y*6)*Math.min(1,(.95-y)*2.2);P.setX(i,x*k);P.setZ(i,z*k)}
  g.computeVertexNormals();return g};

/* ---------- Persona realistica (panneggi, volto, mani, accessori) ---------- */
const POSE={rest:[.06,-.25,.06,-.25,0],pray:[-.35,-1.5,-.35,-1.5,.5],hold:[-.7,-1,-.7,-1,.3],staff:[-.55,-.5,.06,-.25,0],cradle:[-.55,-1,-.55,-1,.35]};
AFRAME.registerComponent('person',{schema:{robe:{default:'#7a3b2e'},mantle:{default:''},skin:{default:'#e2b48a'},hair:{default:'#3a2a1c'},h:{default:1.7},pose:{default:'rest'},
  head:{default:'none'},hc:{default:''},beard:{default:false},halo:{default:false},staff:{default:false},gift:{default:false},trim:{default:false},tilt:{default:0}},
init(){
  const d=this.data,h=d.h,g=new T.Group(),sk=std(d.skin,{roughness:.55}),rb=tex(d.robe,'cloth'),hr=std(d.hair,{roughness:.9});this.g=g;this.ph=Math.random()*9;
  g.add(blob(h*.3));
  g.add(new T.Mesh(lathe([[.17,.03],[.16,.2],[.125,.42],[.095,.56],[.105,.68],[.13,.79],[.1,.84],[.045,.86]],h,40,0,6.283,.04),rb));
  if(d.mantle)g.add(new T.Mesh(lathe([[.2,.06],[.19,.3],[.16,.55],[.15,.75],[.13,.83],[.1,.855]],h,40,.7,6.283-1.4,.06),tex(d.mantle,'cloth')));
  const belt=M(new T.TorusGeometry(.1*h,.009*h,8,24),std('#3b2a1c'),0,.57*h,0);belt.rotation.x=Math.PI/2;g.add(belt);
  if(d.trim){const t=M(new T.TorusGeometry(.17*h,.007*h,6,36),gold(),0,.04*h,0);t.rotation.x=Math.PI/2;g.add(t)}
  for(const s of [-1,1])g.add(M(new T.BoxGeometry(.05*h,.02*h,.1*h),std('#4a3322'),s*.05*h,.01*h,.07*h));
  g.add(M(new T.CylinderGeometry(.024*h,.028*h,.06*h,12),sk,0,.875*h,0));
  /* testa */
  const hd=new T.Group(),R=.062*h;hd.position.y=.935*h;hd.rotation.x=d.tilt;g.add(hd);this.hd=hd;this.tilt=d.tilt;
  hd.add(M(new T.SphereGeometry(R,24,18),sk,0,0,0,[.88,1.12,1]));
  hd.add(M(new T.SphereGeometry(.012*h,10,8),sk,0,-.006*h,R*.98,[.8,1.3,1.1]));
  for(const s of [-1,1]){
    hd.add(M(new T.SphereGeometry(.013*h,8,6),sk,s*R*.88,0,0,[.4,1,.8]));
    hd.add(M(new T.SphereGeometry(.0085*h,10,8),std('#f2eee6'),s*.021*h,.013*h,.054*h,[1,.8,.6]));
    hd.add(M(new T.SphereGeometry(.0052*h,8,6),std('#241810',{roughness:.3}),s*.021*h,.013*h,.0575*h));
    hd.add(M(new T.BoxGeometry(.022*h,.0035*h,.005*h),hr,s*.021*h,.027*h,.0555*h));
  }
  hd.add(M(new T.BoxGeometry(.02*h,.0035*h,.004*h),std('#8a4a42'),0,-.03*h,.055*h));
  if(d.head==='none'||d.head==='crown'){const c=M(new T.SphereGeometry(R*1.04,24,14,0,6.283,0,1.95),hr,0,.004*h,-.004*h,[.9,1.12,1.04]);c.rotation.x=-.9;hd.add(c)}
  if(d.beard){hd.add(M(new T.SphereGeometry(.052*h,16,12),hr,0,-.04*h,.018*h,[.9,1.05,.85]));hd.add(M(new T.SphereGeometry(.02*h,10,8),hr,0,-.022*h,.056*h,[2,.45,.6]))}
  if(d.head==='veil'||d.head==='hood')hd.add(new T.Mesh(lathe([[.11,-.17],[.098,-.09],[.082,-.02],[.075,.03],[.05,.062],[.002,.072]],h,32,.55,6.283-1.1,.03),tex(d.hc||d.robe,'cloth')));
  if(d.head==='crown'){
    if(d.hc)for(const y of [.03,.05,.07]){const t=M(new T.TorusGeometry(.064*h,.02*h,8,24),tex(d.hc,'cloth'),0,y*h,0,[1,.6,1]);t.rotation.x=Math.PI/2;hd.add(t)}
    hd.add(M(new T.CylinderGeometry(.064*h,.057*h,.045*h,14,1,true),gold(),0,.068*h,0));
    for(let i=0;i<8;i++){const a=i/8*6.283;hd.add(M(new T.ConeGeometry(.009*h,.03*h,5),gold(),Math.sin(a)*.062*h,.1*h,Math.cos(a)*.062*h))}
  }
  if(d.halo){const hl=new T.Group();hl.position.set(0,.012*h,-.04*h);hl.rotation.x=-.15;
    hl.add(new T.Mesh(new T.TorusGeometry(.1*h,.004*h,8,48),new T.MeshBasicMaterial({color:0xffd27a})));
    hl.add(new T.Mesh(new T.CircleGeometry(.1*h,40),new T.MeshBasicMaterial({color:0xffc24a,transparent:true,opacity:.22,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide})));
    hd.add(hl);this.halo=hl}
  /* braccia con gomito e mano */
  const P=POSE[d.pose]||POSE.rest;
  for(const s of [1,-1]){const a=new T.Group();a.position.set(s*.125*h,.79*h,0);a.rotation.order='YXZ';a.rotation.set(s>0?P[0]:P[2],-s*P[4],s*.07);
    a.add(M(new T.CapsuleGeometry(.027*h,.116*h,6,12),rb,0,-.085*h,0));
    const e=new T.Group();e.position.y=-.17*h;e.rotation.x=s>0?P[1]:P[3];a.add(e);
    e.add(M(new T.CapsuleGeometry(.022*h,.106*h,6,12),rb,0,-.075*h,0));
    e.add(M(new T.SphereGeometry(.021*h,12,10),sk,0,-.155*h,0,[.9,1.1,.6]));g.add(a)}
  if(d.staff){g.add(M(new T.CylinderGeometry(.012*h,.015*h,1.15*h,8),std('#6b4a2b',{roughness:.9}),.15*h,.575*h,.22*h));
    g.add(M(new T.TorusGeometry(.05*h,.011*h,8,16,Math.PI),std('#6b4a2b',{roughness:.9}),.1*h,1.15*h,.22*h))}
  if(d.gift){g.add(M(new T.BoxGeometry(.09*h,.05*h,.065*h),gold(),0,.655*h,.27*h));g.add(M(new T.BoxGeometry(.095*h,.018*h,.07*h),gold(),0,.69*h,.27*h));
    g.add(M(new T.SphereGeometry(.011*h,10,8),std('#c8102e',{roughness:.2,emissive:'#80001a',emissiveIntensity:.5}),0,.705*h,.27*h))}

  /* Dettagli anatomici: profilo del naso, guance, orecchie, sopracciglia e barba sagomata */
  const nose=M(new T.SphereGeometry(.012*h,16,12),sk,0,-.004*h,.064*h,[.72,1.55,1.05]);hd.add(nose);
  for(const s of [-1,1]){
    hd.add(M(new T.SphereGeometry(.014*h,14,10),sk,s*.038*h,-.012*h,.035*h,[1,.8,.45]));
    hd.add(M(new T.SphereGeometry(.014*h,12,8),sk,s*.061*h,-.002*h,0,[.45,1.15,.7]));
    hd.add(M(new T.CapsuleGeometry(.004*h,.018*h,4,8),hr,s*.021*h,.031*h,.055*h));
  }
  hd.add(M(new T.SphereGeometry(.008*h,12,8),std('#8e5147',{roughness:.8}),0,-.033*h,.054*h,[1,.5,.45]));
  if(d.beard){
    const beardMat=tex(d.hair,'cloth');
    const beardShape=lathe([[.047,-.025],[.053,-.075],[.043,-.12],[.027,-.16],[.004,-.19]],h,32,.35,5.58,.08);
    const beardMesh=new T.Mesh(beardShape,beardMat);beardMesh.position.set(0,-.005*h,.018*h);hd.add(beardMesh);
    for(const s of [-1,1]){
      const lock=M(new T.CapsuleGeometry(.012*h,.075*h,5,8),hr,s*.035*h,-.083*h,.027*h);
      lock.rotation.z=s*.18;hd.add(lock);
    }
  }
  /* Pieghe verticali del tessuto, con bordi morbidi e variazioni di luce */
  for(let i=0;i<10;i++){
    const a=i/10*Math.PI*2,rr=.126*h;
    const fold=M(new T.CapsuleGeometry(.0035*h,.48*h,4,6),std('#ffffff',{transparent:true,opacity:.12,roughness:1}),
      Math.sin(a)*rr,.39*h,Math.cos(a)*rr);
    fold.rotation.z=Math.sin(a)*.08;fold.rotation.y=a;g.add(fold);
  }
  /* Mani più leggibili, con dita raccolte */
  for(const s of [-1,1]){
    const palm=M(new T.SphereGeometry(.022*h,12,10),sk,s*.125*h,.43*h,.015*h,[.78,1.25,.55]);g.add(palm);
    for(let j=0;j<3;j++){
      const finger=M(new T.CapsuleGeometry(.0055*h,.025*h,4,6),sk,s*.125*h+(j-1)*.009*h,.405*h,.035*h);
      finger.rotation.x=-.3;g.add(finger);
    }
  }
  this.el.setObject3D('m',g);
},
tick(t){const k=t/1000+this.ph;this.hd.rotation.set(this.tilt+Math.sin(k*.9)*.03,Math.sin(k*.6)*.14,0);this.g.scale.y=1+.005*Math.sin(k*1.6);
  if(this.halo)this.halo.scale.setScalar(1+.06*Math.sin(k*2.4))}});

/* ---------- Bue e asinello ---------- */
AFRAME.registerComponent('animal',{schema:{kind:{default:'ox'}},init(){
  const ox=this.data.kind==='ox',s=ox?1.15:.95,hide=tex(ox?'#7b4a2b':'#8a8d97','hide'),pale=std(ox?'#c9a27c':'#d9d4c8',{roughness:.9}),dk=std('#17110d',{roughness:.5}),g=new T.Group();
  g.add(blob(.8*s));
  const b=M(new T.CapsuleGeometry(.27*s,.6*s,8,16),hide,0,.74*s,0);b.rotation.x=Math.PI/2;g.add(b);this.b=b;
  for(const [x,z] of [[-1,1],[1,1],[-1,-1],[1,-1]]){g.add(M(new T.CapsuleGeometry(.05*s,.46*s,4,8),hide,x*.17*s,.3*s,z*.34*s));g.add(M(new T.CylinderGeometry(.05*s,.055*s,.05*s,8),dk,x*.17*s,.03*s,z*.34*s))}
  const nk=new T.Group();nk.position.set(0,.95*s,.5*s);g.add(nk);this.nk=nk;
  const neck=M(new T.CapsuleGeometry(.12*s,.22*s,6,10),hide,0,.06*s,.12*s);neck.rotation.x=1;nk.add(neck);
  const hh=new T.Group();hh.position.set(0,.2*s,.3*s);hh.rotation.x=.5;nk.add(hh);
  hh.add(M(new T.SphereGeometry(.14*s,18,14),hide,0,0,0,[.8,.95,1.25]));
  hh.add(M(new T.SphereGeometry(.085*s,14,10),pale,0,-.03*s,.2*s,[.9,.8,1]));
  for(const x of [-1,1]){
    hh.add(M(new T.SphereGeometry(.014*s,8,6),dk,x*.03*s,-.02*s,.28*s));
    hh.add(M(new T.SphereGeometry(.018*s,10,8),dk,x*.105*s,.05*s,.09*s));
    if(ox){const c=M(new T.ConeGeometry(.04*s,.14*s,8),hide,x*.14*s,.12*s,-.03*s);c.rotation.z=-x*1.3;hh.add(c);
      const hn=M(new T.ConeGeometry(.025*s,.22*s,8),std('#efe6cf',{roughness:.5}),x*.15*s,.2*s,.02*s);hn.rotation.z=-x*.9;hh.add(hn)}
    else{const e=M(new T.CapsuleGeometry(.035*s,.2*s,4,8),hide,x*.07*s,.27*s,-.02*s);e.rotation.z=-x*.25;hh.add(e)}}
  const tl=new T.Group();tl.position.set(0,.88*s,-.62*s);tl.add(M(new T.CapsuleGeometry(.015*s,.32*s,4,6),hide,0,-.2*s,0));tl.add(M(new T.SphereGeometry(.04*s,8,6),dk,0,-.4*s,0));g.add(tl);this.tl=tl;
  g.add(M(new T.SphereGeometry(.001),dk));this.ph=Math.random()*9;this.el.setObject3D('m',g);
},tick(t){const k=t/1000+this.ph;this.nk.rotation.x=Math.sin(k*.6)*.12;this.tl.rotation.z=Math.sin(k*2)*.25;this.b.scale.set(1,1+.01*Math.sin(k*1.5),1)}});

/* ---------- Pecora con lana ---------- */
AFRAME.registerComponent('sheep',{init(){
  const g=new T.Group();
  const wool=std('#eee8dc',{roughness:1}),woolHi=std('#fff8eb',{roughness:1});
  const face=std('#55463b',{roughness:.92}),muzzle=std('#b99b85',{roughness:.9});
  const hoof=std('#302a25',{roughness:.85}),eye=std('#17130f',{roughness:.35});
  const add=(geo,mat,x,y,z,scale)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);if(scale)m.scale.set(...scale);g.add(m);return m;};
  // Torso: longer, soft silhouette, with a natural belly.
  add(new T.SphereGeometry(1,32,24),wool,0,.52,-.015,[.43,.39,.69]);
  add(new T.SphereGeometry(1,24,18),wool,0,.39,.02,[.34,.24,.53]);
  // Individual wool curls distributed over the back and flanks.
  for(let i=0;i<112;i++){
    const u=Math.random()*Math.PI*2,v=(Math.random()-.5)*Math.PI;
    const x=Math.cos(v)*Math.cos(u)*.405;
    const y=.52+Math.sin(v)*.355;
    const z=-.015+Math.cos(v)*Math.sin(u)*.645;
    const r=.045+Math.random()*.025;
    const curl=add(new T.SphereGeometry(r,10,8),i%5===0?woolHi:wool,x,y,z);
    curl.scale.set(1,.9,1);
  }
  // Neck and head held forward, with a gently tapered muzzle.
  const neck=add(new T.CapsuleGeometry(.13,.28,8,16),wool,0,.62,.49,[.85,1,1]);
  neck.rotation.x=-.42;
  const head=new T.Group();head.position.set(0,.76,.68);g.add(head);this.head=head;
  const skull=new T.Mesh(new T.SphereGeometry(.155,24,18),face);skull.scale.set(.9,1.05,1.18);head.add(skull);
  const snout=new T.Mesh(new T.SphereGeometry(.092,20,14),muzzle);snout.position.set(0,-.065,.135);snout.scale.set(.82,.65,1.15);head.add(snout);
  const nose=new T.Mesh(new T.SphereGeometry(.034,16,12),hoof);nose.position.set(0,-.045,.225);nose.scale.set(1,.7,.65);head.add(nose);
  for(const side of [-1,1]){
    const ear=new T.Mesh(new T.SphereGeometry(.075,16,12),face);ear.position.set(side*.17,.035,-.005);ear.scale.set(1.35,.48,.55);ear.rotation.z=side*-.18;head.add(ear);
    const inner=new T.Mesh(new T.SphereGeometry(.038,12,8),muzzle);inner.position.set(side*.19,.038,.018);inner.scale.set(1,.45,.5);head.add(inner);
    const socket=new T.Mesh(new T.SphereGeometry(.035,12,8),muzzle);socket.position.set(side*.105,.025,.115);head.add(socket);
    const pupil=new T.Mesh(new T.SphereGeometry(.018,12,8),eye);pupil.position.set(side*.11,.025,.145);head.add(pupil);
    const glint=new T.Mesh(new T.SphereGeometry(.006,8,6),woolHi);glint.position.set(side*.115,.034,.16);head.add(glint);
  }
  // Four tapered legs with joints and dark cloven hooves.
  this.legs=[];
  for(const x of [-.245,.245])for(const z of [-.43,.43]){
    const leg=new T.Group();leg.position.set(x,.35,z);g.add(leg);this.legs.push(leg);
    const upper=new T.Mesh(new T.CapsuleGeometry(.047,.19,6,10),wool);upper.position.y=-.045;leg.add(upper);
    const lower=new T.Mesh(new T.CylinderGeometry(.026,.035,.17,10),face);lower.position.y=-.19;leg.add(lower);
    const foot=new T.Mesh(new T.BoxGeometry(.085,.065,.105),hoof);foot.position.set(0,-.285,.025);leg.add(foot);
    const split=new T.Mesh(new T.BoxGeometry(.008,.04,.075),std('#171411'));split.position.set(0,-.286,.07);leg.add(split);
  }
  // Small fluffy tail.
  const tail=new T.Group();tail.position.set(0,.62,-.68);g.add(tail);this.tail=tail;
  const tailBall=new T.Mesh(new T.SphereGeometry(.085,14,10),woolHi);tailBall.scale.set(.8,1.15,.8);tail.add(tailBall);
  this.el.setObject3D('m',g);this.phase=Math.random()*8;
},tick(t){
  const k=t/1000+this.phase;
  const nibble=(Math.sin(k*1.2)+1)*.5;
  this.head.rotation.x=.05+nibble*.34;
  this.head.rotation.z=Math.sin(k*.7)*.035;
  this.tail.rotation.x=Math.sin(k*3)*.28;
  this.legs.forEach((leg,i)=>{leg.rotation.x=Math.sin(k*2.1+i*Math.PI)*.035});
}});

/* ---------- Gesù Bambino ---------- */
AFRAME.registerComponent('baby',{init(){
  const g=new T.Group(),c=tex('#f3ead8','cloth');const b=M(new T.CapsuleGeometry(.055,.13,6,12),c);b.rotation.z=Math.PI/2;g.add(b);
  for(const x of [-.03,.05]){const r=M(new T.TorusGeometry(.058,.007,6,16),std('#d9c8a3'),x,0,0);r.rotation.y=Math.PI/2;g.add(r)}
  const sk=std('#f0c7a0',{roughness:.5});g.add(M(new T.SphereGeometry(.05,16,12),sk,-.15,.005,0));
  for(const z of [-1,1])g.add(M(new T.BoxGeometry(.014,.003,.004),std('#5a3a2a'),-.15,.048,z*.02));
  g.add(M(new T.SphereGeometry(.007,6,6),sk,-.15,.05,0));this.g=g;this.el.setObject3D('m',g);
},tick(t){this.g.scale.y=1+.03*Math.sin(t/700)}});

/* ---------- Pellegrini: i Magi camminano, si fermano, tornano ---------- */
AFRAME.registerComponent('pilgrim',{schema:{from:{type:'vec3'},to:{type:'vec3'},speed:{default:.4}},init(){
  const f=this.data.from,t=this.data.to;this.u=0;this.dir=1;this.wait=2000;this.yaw=0;this.base=Math.atan2(t.x-f.x,t.z-f.z);this.len=Math.hypot(t.x-f.x,t.z-f.z)},
tick(t,dt){const d=this.data,o=this.el.object3D,c=this.el.firstElementChild&&this.el.firstElementChild.object3D;let walk=false;
  if(this.wait>0)this.wait-=dt;else{walk=true;this.u+=this.dir*dt/1000*d.speed/this.len;
    if(this.u>=1){this.u=1;this.dir=-1;this.wait=9000}else if(this.u<=0){this.u=0;this.dir=1;this.wait=3000}}
  const tg=this.base+(walk&&this.dir<0?Math.PI:0),df=((tg-this.yaw+Math.PI)%6.283+6.283)%6.283-Math.PI;this.yaw+=df*Math.min(1,dt*.004);
  o.position.set(d.from.x+(d.to.x-d.from.x)*this.u,0,d.from.z+(d.to.z-d.from.z)*this.u);o.rotation.y=this.yaw;
  if(c)c.position.y=walk?Math.abs(Math.sin(t/190))*.03:0}});



/* ---------- Firma incisa sul selciato ---------- */
AFRAME.registerComponent('ground-signature',{init(){
  const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=256;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,1024,256);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#d8ae68';ctx.shadowBlur=18;
  ctx.font='600 94px Georgia,serif';ctx.fillStyle='#d8b77e';
  ctx.fillText('NICOLA LOMBARDI',512,128);
  ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='rgba(255,238,198,.75)';
  ctx.strokeText('NICOLA LOMBARDI',512,128);
  const tex=new T.CanvasTexture(canvas);tex.colorSpace=T.SRGBColorSpace;
  const mat=new T.MeshBasicMaterial({map:tex,transparent:true,opacity:.9,side:T.DoubleSide,depthWrite:false});
  const mesh=new T.Mesh(new T.PlaneGeometry(5.6,1.4),mat);
  mesh.rotation.x=-Math.PI/2;mesh.position.set(0,.055,4.8);
  this.el.setObject3D('signature',mesh);
}});

/* ---------- Stella cometa tridimensionale ---------- */
AFRAME.registerComponent('comet-star',{schema:{scale:{default:1}},init(){
  const root=new T.Group(),s=this.data.scale;root.scale.setScalar(s);
  const goldMat=new T.MeshStandardMaterial({color:0xffdf9a,emissive:0xffa72b,emissiveIntensity:1.35,metalness:.25,roughness:.28});
  const coreMat=new T.MeshBasicMaterial({color:0xfff8df});
  const shape=new T.Shape(),outer=.62,inner=.27;
  for(let i=0;i<16;i++){const a=-Math.PI/2+i*Math.PI/8,r=i%2?inner:outer,x=Math.cos(a)*r,y=Math.sin(a)*r;i?shape.lineTo(x,y):shape.moveTo(x,y)}
  shape.closePath();
  const starGeo=new T.ExtrudeGeometry(shape,{depth:.12,bevelEnabled:true,bevelSegments:4,steps:1,bevelSize:.045,bevelThickness:.045});
  starGeo.center();
  const star=new T.Mesh(starGeo,goldMat);root.add(star);
  const core=new T.Mesh(new T.SphereGeometry(.16,24,18),coreMat);core.position.z=.11;root.add(core);
  const glow=new T.Mesh(new T.SphereGeometry(.38,24,18),new T.MeshBasicMaterial({color:0xffc65c,transparent:true,opacity:.18,blending:T.AdditiveBlending,depthWrite:false}));root.add(glow);
  // La coda parte dal lato alto-destro della stella e si allunga in diagonale.
  const points=[new T.Vector3(.34,.18,-.04),new T.Vector3(.95,.52,-.08),new T.Vector3(1.75,.92,-.15),new T.Vector3(2.8,1.28,-.22),new T.Vector3(4.05,1.48,-.3)];
  const curve=new T.CatmullRomCurve3(points);
  const tailGeo=new T.TubeGeometry(curve,64,.105,10,false);
  const tail=new T.Mesh(tailGeo,new T.MeshBasicMaterial({color:0xffd98b,transparent:true,opacity:.78,blending:T.AdditiveBlending,depthWrite:false}));root.add(tail);
  for(let i=0;i<38;i++){
    const u=i/38,p=curve.getPoint(u),r=.018+Math.random()*.035;
    const mote=new T.Mesh(new T.SphereGeometry(r,8,6),new T.MeshBasicMaterial({color:i%3?0xffd78b:0xffffff,transparent:true,opacity:.55+Math.random()*.4}));
    mote.position.copy(p);mote.position.y+=(Math.random()-.5)*.16;mote.position.z+=(Math.random()-.5)*.14;root.add(mote);
  }
  const light=new T.PointLight(0xffc66e,2.2,24,1.5);light.position.set(0,0,.4);root.add(light);
  this.el.setObject3D('comet',root);this.root=root;this.glow=glow;this.tail=tail;this.baseY=this.el.object3D.position.y;
},tick(t){
  const k=t/1000;this.root.rotation.z=Math.sin(k*.18)*.035;
  this.root.position.y=Math.sin(k*.55)*.12;
  const pulse=1+.055*Math.sin(k*2.1);this.glow.scale.setScalar(pulse);
  this.tail.material.opacity=.62+.13*Math.sin(k*1.7);
}});

/* ---------- Stelle, code rain, skyline, stelle cadenti, terminale, luci, stick ---------- */
AFRAME.registerComponent('starfield',{init(){
  const n=1500,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const t=Math.random()*6.283,u=Math.random()*.95+.05,s=Math.sqrt(1-u*u);p.set([Math.cos(t)*s*250,u*250,Math.sin(t)*s*250],i*3)}
  const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));
  this.el.setObject3D('s',new T.Points(g,new T.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false,fog:false})))}});

AFRAME.registerComponent('coderain',{schema:{char:{default:'0'},color:{default:'#4de8ff'},count:{default:180}},init(){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  x.font='bold 52px monospace';x.textAlign='center';x.textBaseline='middle';x.fillStyle=this.data.color;x.shadowColor=this.data.color;x.shadowBlur=8;x.fillText(this.data.char,32,34);
  const n=this.data.count;this.p=new Float32Array(n*3);this.v=new Float32Array(n);for(let i=0;i<n;i++)this.rs(i,true);
  const g=new T.BufferGeometry();this.a=new T.BufferAttribute(this.p,3);g.setAttribute('position',this.a);
  this.mat=new T.PointsMaterial({map:new T.CanvasTexture(c),size:.45,transparent:true,opacity:.75,depthWrite:false,blending:T.AdditiveBlending});
  this.el.setObject3D('p',new T.Points(g,this.mat))},
rs(i,r){this.p.set([(Math.random()-.5)*34,r?Math.random()*14:14,(Math.random()-.5)*34-3],i*3);this.v[i]=.6+Math.random()*1.4},
tick(t,dt){const s=dt/1000;for(let i=0;i<this.v.length;i++){this.p[i*3+1]-=this.v[i]*s;if(this.p[i*3+1]<0)this.rs(i,false)}this.a.needsUpdate=true;}});

AFRAME.registerComponent('skyline',{init(){
  let s=5;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const m=new T.MeshBasicMaterial({color:0x070d1f});this.l=new T.LineBasicMaterial({color:0x2fd6ff,transparent:true,opacity:.5});
  for(let i=0;i<64;i++){const w=2+r()*4,h=2+r()*(i%7?7:18),a=r()*6.283,d=40+r()*30,geo=new T.BoxGeometry(w,h,w),b=new T.Mesh(geo,m);
    b.add(new T.LineSegments(new T.EdgesGeometry(geo),this.l));b.position.set(Math.cos(a)*d,h/2,Math.sin(a)*d);this.el.object3D.add(b)}},
tick(t){this.l.opacity=.42+.18*Math.sin(t/800)}});

AFRAME.registerComponent('shooter',{init(){
  this.m=new T.Mesh(new T.BoxGeometry(.25,.25,14),new T.MeshBasicMaterial({color:0xffffff,fog:false}));this.m.visible=false;
  this.el.setObject3D('m',this.m);this.next=2000;this.life=0;this.v=new T.Vector3()},
tick(t,dt){const m=this.m;
  if(m.visible){this.life-=dt;m.position.addScaledVector(this.v,dt/1000);if(this.life<=0)m.visible=false}
  else if((this.next-=dt)<=0){m.position.set((Math.random()-.5)*160-40,90+Math.random()*60,-130-Math.random()*40);this.v.set(70+Math.random()*50,-35,0);
    m.lookAt(m.position.clone().add(this.v));m.visible=true;this.life=1600;this.next=3000+Math.random()*5000}}});

AFRAME.registerComponent('typewriter',{schema:{lines:{type:'string'}},init(){
  const full=this.data.lines.split('|').join('\n');let i=0,w=0;
  this.iv=setInterval(()=>{if(i<full.length){i++;w=0}else if(++w>60){i=0}
    this.el.setAttribute('text','value',full.slice(0,i)+(Date.now()%800<400?'_':' '))},55)},
remove(){clearInterval(this.iv)}});

AFRAME.registerComponent('flicker',{schema:{base:{default:1.2},amp:{default:.5}},tick(t){
  const l=this.el.components.light;if(l)l.light.intensity=this.data.base+Math.sin(t/90)*this.data.amp*.5+Math.sin(t/37)*this.data.amp*.3+Math.random()*this.data.amp*.2}});

AFRAME.registerComponent('thumbstick-move',{init(){
  this.in=new T.Vector2();this.q=new T.Quaternion();
  this.el.addEventListener('thumbstickmoved',e=>this.in.set(e.detail.x,e.detail.y))},
tick(t,dt){if(this.in.length()<.15)return;const c=this.el.querySelector('[camera]');if(!c)return;
  c.object3D.getWorldQuaternion(this.q);const yaw=new T.Euler().setFromQuaternion(this.q,'YXZ').y,s=2.2*dt/1000,p=this.el.object3D.position;
  p.x+=(this.in.x*Math.cos(yaw)+this.in.y*Math.sin(yaw))*s;p.z+=(-this.in.x*Math.sin(yaw)+this.in.y*Math.cos(yaw))*s}});

        position="0 .82 0" flicker="base:2;amp:1"></a-entity>
    </a-entity>
    <a-entity sheep position="-2.6 0 -.2" rotation="0 40 0" scale="0.72 0.72 0.72"></a-entity>
    <a-entity sheep position="-5.2 0 -1.2" rotation="0 -30 0" scale="0.72 0.72 0.72"></a-entity>
    <a-entity sheep position="-3.4 0 .9" rotation="0 150 0" scale="0.72 0.72 0.72"></a-entity>
    <a-entity sheep position="-5 0 .2" rotation="0 80 0" scale="0.72 0.72 0.72"></a-entity>

    <!-- Re Magi -->
    <a-entity pilgrim="from:6.4 0 .2;to:2.6 0 -1.7;speed:.4">
      <a-entity person="robe:#8a2f57;mantle:#d7a52b;head:crown;hc:#f1e7d0;hair:#d9d9d9;beard:true;trim:true;gift:true;pose:hold;h:1.74"></a-entity></a-entity>
    <a-entity pilgrim="from:7.8 0 .9;to:3.9 0 -1.1;speed:.38">
      <a-entity person="robe:#1d7a76;mantle:#e8dfc8;head:crown;hc:#b02a2a;hair:#2a1c12;beard:true;trim:true;gift:true;pose:hold;skin:#d9a066;h:1.7"></a-entity></a-entity>
    <a-entity pilgrim="from:9.2 0 1.6;to:5.2 0 -.5;speed:.36">
      <a-entity person="robe:#c26a1d;mantle:#2d2f6b;head:crown;hc:#e8dfc8;hair:#14100c;beard:true;trim:true;gift:true;pose:hold;skin:#6b4429;h:1.78"></a-entity></a-entity>

    <!-- Stella cometa: nucleo a otto punte, coda dorata e pulviscolo luminoso -->
    <a-entity comet-star="scale:1.0" position="0 8.2 -3.4"></a-entity>
    <!-- Fascio di luce della cometa: torna a scendere fino al terreno -->
    <a-entity position="0 4.05 -3.4">
      <a-cone radius-bottom="2.15" radius-top=".035" height="8.1"
        material="shader:flat;color:#ffe6a8;transparent:true;opacity:.105;side:double;depthWrite:false"
        position="0 0 0"></a-cone>
      <a-cone radius-bottom="1.15" radius-top=".018" height="8.05"
        material="shader:flat;color:#fff1cf;transparent:true;opacity:.10;side:double;depthWrite:false"
        position="0 0 .015"></a-cone>
      <a-entity light="type:point;color:#ffdfa0;intensity:1.15;distance:18;decay:1.7" position="0 -3.55 0"></a-entity>
    </a-entity>
    <a-circle radius="2.2" rotation="-90 0 0" position="0 .035 -3.4"
      material="shader:flat;color:#f4d69b;transparent:true;opacity:.12;side:double"></a-circle>


  </a-entity>

  <!-- Giocatore -->
  <a-entity id="rig" position="0 0 6" thumbstick-move wasd-controls="acceleration:30">
    <a-entity camera="far:700" look-controls position="0 1.6 0"></a-entity>
    <a-entity laser-controls="hand:left" raycaster="far:0"></a-entity>
    <a-entity laser-controls="hand:right" raycaster="far:0"></a-entity>
  </a-entity>
</a-scene>

<script>
  /* Gerusalemme antica: quartiere in pietra, vicoli, mura e colline stratificate */
  document.querySelector('a-scene').addEventListener('loaded',()=>{
    const root=document.getElementById('village').object3D;
    const stone=['#b79a75','#c4a783','#9c8061','#d0b38a','#8e765b'];
    const mortar='#6e5942';
    const mat=(c,rough=1)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
    const add=(geo,material,x,y,z,parent=root)=>{const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);parent.add(m);return m;};
    function house(x,z,w,h,d,rot=0,variant=0){
      const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;root.add(g);
      const wall=mat(stone[variant%stone.length]),shadow=mat('#49392b'),wood=mat('#513522'),roof=mat('#897052');
      // Volume murario con basamento in pietra e coronamento irregolare.
      const body=add(new THREE.BoxGeometry(w,h,d),wall,0,h/2,0,g);
      const base=add(new THREE.BoxGeometry(w+.12,.22,d+.12),mat('#80694e'),0,.11,0,g);
      add(new THREE.BoxGeometry(w+.16,.18,d+.16),roof,0,h+.09,0,g);
      // Merli bassi e parapetto sul tetto.
      for(let i=-1;i<=1;i++)add(new THREE.BoxGeometry(.22,.32,.2),wall,i*w*.32,h+.31,-d*.42,g);
      // Portale ad arco: stipiti, architrave curvo e porta in legno.
      add(new THREE.BoxGeometry(.56,h*.53,.08),shadow,0,h*.265,d/2+.045,g);
      add(new THREE.BoxGeometry(.66,.12,.12),mat('#d0b38a'),0,h*.54,d/2+.05,g);
      add(new THREE.BoxGeometry(.42,h*.48,.045),wood,0,h*.24,d/2+.095,g);
      add(new THREE.SphereGeometry(.025,10,8),gold(),.14,h*.24,d/2+.125,g);
      // Finestre profonde con architrave e luce interna.
      for(const side of [-1,1]){
        const wx=side*w*.29,wy=h*.66;
        add(new THREE.BoxGeometry(.32,.5,.075),shadow,wx,wy,d/2+.04,g);
        add(new THREE.BoxGeometry(.39,.075,.1),mat('#d9bd91'),wx,wy+.29,d/2+.045,g);
        add(new THREE.BoxGeometry(.035,.5,.09),wood,wx,wy,d/2+.09,g);
        add(new THREE.BoxGeometry(.3,.035,.09),wood,wx,wy,d/2+.09,g);
        const pane=add(new THREE.PlaneGeometry(.25,.39),new THREE.MeshBasicMaterial({color:0xffb85c,transparent:true,opacity:.62}),wx,wy,d/2+.085,g);
        const lamp=new THREE.PointLight(0xffad55,.5,4,2);lamp.position.set(wx,wy,d/2+.3);g.add(lamp);
      }
      // Blocchi di pietra disegnati sulla facciata.
      for(let row=0;row<Math.floor(h/.32);row++){
        for(let col=0;col<Math.ceil(w/.42);col++){
          if(row===0||((row+col)%3===0)){
            const bx=-w/2+.22+col*.42,by=.28+row*.32;
            add(new THREE.BoxGeometry(.36,.018,.018),mat('#79634b'),bx,by,d/2+.012,g);
          }
        }
      }
      // Tenda di mercato su alcune case.
      if(variant%3===1){
        const awning=add(new THREE.BoxGeometry(w*.72,.07,.9),mat('#a65e42'),0,h*.72,d/2+.48,g);
        awning.rotation.x=-.16;
        for(let i=-2;i<=2;i++)add(new THREE.BoxGeometry(.06,.24,.06),mat('#e0c49a'),i*w*.13,h*.72,d/2+.9,g);
      }
      // Scala esterna in pietra.
      if(variant%4===2)for(let i=0;i<4;i++)add(new THREE.BoxGeometry(.65,.12,.25),mat('#8d765a'),-w*.34,.06+i*.12,-d*.15+i*.25,g);
    }
    // Case di varie altezze attorno alla piazza, non un anello uniforme.
    const houses=[
      [-12,-8,3.3,3.2,2.8, .3],[-8,-13,2.8,2.5,2.6,.9],[-2,-15,3.5,3.8,2.8,0],
      [5,-14,3.1,3.1,2.7,-.5],[11,-10,3.4,3.7,2.8,-.8],[14,-3,2.8,2.8,2.5,-1.4],
      [13,6,3.6,3.5,3,2.8],[8,12,3,2.7,2.5,2.2],[1,14,3.8,3.3,2.8,3.1],
      [-7,13,3.1,3.7,2.8,2.7],[-13,7,3.4,3.2,2.8,1.9],[-15,0,2.8,2.7,2.5,1.5],
      [-10,-2,2.4,2.4,2.2,.2],[10,-1,2.5,2.8,2.4,-.3],[-6,8,2.8,2.5,2.4,2.8],[6,8,2.6,2.6,2.3,2.4]
    ];
    houses.forEach((v,i)=>house(...v,i));
    // Mura della città e torri lontane, silhouette contro il cielo.
    for(let i=0;i<24;i++){
      const a=i/24*Math.PI*2,r=23+(i%3)*1.1,x=Math.cos(a)*r,z=Math.sin(a)*r;
      const wall=add(new THREE.BoxGeometry(3.1,2.2,.65),mat('#77634e'),x,1.1,z);
      wall.rotation.y=-a;
      if(i%3===0){
        const tower=add(new THREE.CylinderGeometry(.72,.82,5.2,8),mat('#92785a'),x,2.6,z);
        add(new THREE.CylinderGeometry(.85,.85,.22,8),mat('#594735'),x,5.2,z);
      }
    }
    // Strade in terra battuta, pietre irregolari e gradini.
    const plaza=add(new THREE.CircleGeometry(8.5,80),mat('#a68a65'),0,.018,0);plaza.rotation.x=-Math.PI/2;
    for(let i=0;i<260;i++){
      const a=Math.random()*Math.PI*2,r=2+Math.random()*13,x=Math.cos(a)*r,z=Math.sin(a)*r;
      const stoneMesh=add(new THREE.DodecahedronGeometry(.12+Math.random()*.12,0),mat(i%3?'#b59a76':'#806a50'),x,.045,z);
      stoneMesh.scale.set(1.2,.25,.8);stoneMesh.rotation.y=Math.random()*Math.PI;
    }
    // Colline desertiche lontane con profilo morbido.
    for(let i=0;i<9;i++){
      const a=i/9*Math.PI*2,r=31, x=Math.cos(a)*r,z=Math.sin(a)*r;
      const hill=add(new THREE.SphereGeometry(1,20,14),mat(i%2?'#625344':'#79634d'),x,-.3,z);
      hill.scale.set(8+Math.random()*5,2.5+Math.random()*2,5);
    }
    // Palme più naturali: tronco inclinato, foglie curve e datteri.
    for(const [x,z] of [[-9,-7],[9,-8],[-11,3],[11,4],[0,-13],[-15,-5],[15,8]]){
      const trunk=add(new THREE.CylinderGeometry(.11,.22,3.8,9),mat('#765033'),x,1.9,z);
      trunk.rotation.z=.07;
      for(let j=0;j<9;j++){
        const a=j/9*Math.PI*2;
        const leaf=add(new THREE.ConeGeometry(.16,2.35,7),mat(j%2?'#596442':'#6e7548'),x+Math.cos(a)*.78,3.45+Math.sin(a)*.12,z+Math.sin(a)*.78);
        leaf.rotation.z=-Math.PI/2+Math.cos(a)*.42;leaf.rotation.y=-a;
      }
    }
    // Incisioni sottili e lastre di pavimentazione nei punti di passaggio.
    for(let i=0;i<90;i++){
      const a=Math.random()*Math.PI*2,r=2.5+Math.random()*10,x=Math.cos(a)*r,z=Math.sin(a)*r;
      const slab=add(new THREE.BoxGeometry(.34+Math.random()*.34,.018,.18+Math.random()*.18),
        mat(i%2?'#9c8261':'#c1a27b'),x,.035,z);
      slab.rotation.y=Math.random()*Math.PI;
    }
    // Piccole giare e cesti presso alcune facciate per dare scala e vita al villaggio.
    for(const [x,z] of [[-11,-7],[-8,-13],[10,-10],[13,6],[-13,7],[7,12]]){
      const jar=add(new THREE.CylinderGeometry(.12,.17,.34,14),mat('#9b6545'),x,.18,z);
      const rim=add(new THREE.TorusGeometry(.12,.025,8,20),mat('#c49b6c'),x,.35,z);
      rim.rotation.x=Math.PI/2;
      for(let j=0;j<4;j++){
        const fruit=add(new THREE.SphereGeometry(.055,10,8),mat(j%2?'#9d392b':'#c18a36'),x+(Math.random()-.5)*.15,.43,z+(Math.random()-.5)*.15);
      }
    }
    // Lampade a olio nei vicoli: piccoli punti caldi e luce radente.
    for(const [x,z] of [[-7,-4],[7,-5],[-8,5],[8,4],[-2,9],[3,-9]]){
      const post=add(new THREE.CylinderGeometry(.035,.05,1.7,8),mat('#493321'),x,.85,z);
      const flame=add(new THREE.SphereGeometry(.095,12,10),new THREE.MeshBasicMaterial({color:0xffbd62}),x,1.78,z);
      const lamp=new THREE.PointLight(0xffad55,.85,7,2);lamp.position.set(x,1.8,z);root.add(lamp);
    }
  });
</script>
</body>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Presepe Moderno VR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('interazione-presepe', {
      init: function () {
        let el = this.el;
        let luce = document.querySelector('#luce-capanna');
        let audio = document.querySelector('#audio-natale');
        el.addEventListener('click', function () {
          if (audio.paused) {
            audio.play();
          } else {
            audio.pause();
          }
          luce.setAttribute('animation', {
            property: 'light.intensity',
            from: 35,
            to: 70,
            dur: 300,
            dir: 'alternate',
            loop: 3
          });
        });
      }
    });

    AFRAME.registerComponent('rotazione-continua', {
      tick: function (t, dt) {
        let rot = this.el.getAttribute('rotation');
        this.el.setAttribute('rotation', {
          x: rot.x,
          y: rot.y + (dt * 0.03),
          z: rot.z
        });
      }
    });
  </script>
</head>
<body>

  <a-scene webxr="optionalFeatures: hit-test">

    <a-assets>
      <audio id="audio-natale" src="https://cdn.freesound.org/previews/518/518872_11270275-lq.mp3" crossorigin="anonymous" preload="auto"></audio>
    </a-assets>

    <a-sky color="#030511"></a-sky>

    <a-entity id="stelle">
      <a-sphere position="-12 18 -20" radius="0.08" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="15 22 -18" radius="0.1" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="-8 10 -15" radius="0.06" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="8 14 -12" radius="0.07" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="-20 15 -25" radius="0.12" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="18 12 -22" radius="0.09" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="0 25 -30" radius="0.15" color="#ffffff" material="emissive: #ffffff"></a-sphere>
    </a-entity>

    <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#0a0e1a" material="roughness: 0.8; metalness: 0.2"></a-plane>

    <a-ring position="0 0.01 -3" rotation="-90 0 0" radius-inner="1.8" radius-outer="3.5" color="#1a233a" material="roughness: 0.5; metalness: 0.5"></a-ring>

    <a-light type="ambient" color="#1e293b" intensity="0.6"></a-light>
    <a-light id="luce-capanna" type="point" color="#ffaa44" intensity="35" distance="12" position="0 2.2 -3"></a-light>
    <a-light type="directional" color="#38bdf8" intensity="0.8" position="-5 10 5"></a-light>

    <a-entity id="stella-cometa" class="clickable" interazione-presepe position="0 4.8 -3.5" animation="property: position; to: 0 5.0 -3.5; dir: alternate; dur: 2000; loop: true">
      <a-octahedron color="#ffd700" radius="0.4" material="emissive: #ffae00; emissiveIntensity: 1" rotazione-continua></a-octahedron>
      <a-light type="point" color="#ffe875" intensity="15" distance="10"></a-light>
      <a-cone position="-0.8 0 0" rotation="0 0 90" radius-bottom="0.2" radius-top="0" height="1.2" color="#ffd700" material="emissive: #ffae00; emissiveIntensity: 0.8; opacity: 0.7; transparent: true"></a-cone>
    </a-entity>

    <a-entity id="struttura-moderna" position="0 0 -3">
      <a-torus position="0 1.8 0" radius="2.2" radius-tubular="0.04" segments-tubular="32" color="#cca43b" material="metalness: 0.8; roughness: 0.2"></a-torus>
      <a-cone position="-1.5 1.5 0" rotation="0 0 -30" radius-bottom="0.05" radius-top="0.05" height="3.2" color="#cca43b" material="metalness: 0.8; roughness: 0.2"></a-cone>
      <a-cone position="1.5 1.5 0" rotation="0 0 30" radius-bottom="0.05" radius-top="0.05" height="3.2" color="#cca43b" material="metalness: 0.8; roughness: 0.2"></a-cone>
      <a-cylinder position="0 0.05 0" radius="2.5" height="0.1" color="#1e293b" material="metalness: 0.5; roughness: 0.3"></a-cylinder>
    </a-entity>

    <a-entity id="bambin-gesu" class="clickable" interazione-presepe position="0 0.45 -3" animation__hover="property: scale; to: 1.15 1.15 1.15; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
      <a-box position="0 0 0" width="0.7" height="0.25" depth="0.45" color="#3d271d" material="roughness: 0.9"></a-box>
      <a-box position="0 0.15 0" width="0.6" height="0.1" depth="0.38" color="#fef08a" material="roughness: 0.9"></a-box>
      <a-sphere position="0 0.28 0" radius="0.16" color="#fbcfe8" material="roughness: 0.4"></a-sphere>
      <a-cylinder position="0 0.22 0" radius="0.15" height="0.25" color="#ffffff" material="roughness: 0.3"></a-cylinder>
      <a-ring position="0 0.48 0" rotation="-90 0 0" radius-inner="0.12" radius-outer="0.16" color="#ffd700" material="emissive: #ffd700; emissiveIntensity: 1"></a-ring>
    </a-entity>

    <a-entity id="maria" position="-0.9 0 -2.8" rotation="0 25 0">
      <a-cone position="0 0.75 0" radius-bottom="0.35" radius-top="0.1" height="1.3" color="#1e40af" material="roughness: 0.4; metalness: 0.1"></a-cone>
      <a-sphere position="0 1.35 0" radius="0.15" color="#fbcfe8"></a-sphere>
      <a-cone position="0 1.38 0.02" rotation="15 0 0" radius-bottom="0.2" radius-top="0.05" height="0.45" color="#60a5fa"></a-cone>
    </a-entity>

    <a-entity id="giuseppe" position="0.9 0 -2.8" rotation="0 -25 0">
      <a-cone position="0 0.9 0" radius-bottom="0.38" radius-top="0.12" height="1.6" color="#854d0e" material="roughness: 0.5"></a-cone>
      <a-sphere position="0 1.62 0" radius="0.16" color="#fbcfe8"></a-sphere>
      <a-cylinder position="0.2 0.85 0.2" radius="0.02" height="1.7" color="#d97706"></a-cylinder>
    </a-entity>

    <a-entity id="re-magio-1" position="-2.2 0 -2" rotation="0 45 0">
      <a-cone position="0 0.85 0" radius-bottom="0.3" radius-top="0.1" height="1.5" color="#7e22ce" material="metalness: 0.3; roughness: 0.4"></a-cone>
      <a-sphere position="0 1.55 0" radius="0.14" color="#fbcfe8"></a-sphere>
      <a-cone position="0 1.72 0" radius-bottom="0.12" radius-top="0.02" height="0.25" color="#ffd700" material="metalness: 0.9; roughness: 0.1"></a-cone>
      <a-box position="0.25 0.8 0" width="0.2" height="0.2" depth="0.2" color="#ffd700" material="metalness: 0.9; roughness: 0.1"></a-box>
    </a-entity>

    <a-entity id="re-magio-2" position="-2.8 0 -3" rotation="0 40 0">
      <a-cone position="0 0.85 0" radius-bottom="0.3" radius-top="0.1" height="1.5" color="#15803d" material="metalness: 0.3; roughness: 0.4"></a-cone>
      <a-sphere position="0 1.55 0" radius="0.14" color="#fbcfe8"></a-sphere>
      <a-cone position="0 1.72 0" radius-bottom="0.12" radius-top="0.02" height="0.25" color="#ffd700" material="metalness: 0.9; roughness: 0.1"></a-cone>
      <a-sphere position="0.25 0.8 0" radius="0.12" color="#ffd700" material="metalness: 0.9; roughness: 0.1"></a-sphere>
    </a-entity>

    <a-entity id="re-magio-3" position="2.3 0 -2.2" rotation="0 -40 0">
      <a-cone position="0 0.85 0" radius-bottom="0.3" radius-top="0.1" height="1.5" color="#b91c1c" material="metalness: 0.3; roughness: 0.4"></a-cone>
      <a-sphere position="0 1.55 0" radius="0.14" color="#fbcfe8"></a-sphere>
      <a-cone position="0 1.72 0" radius-bottom="0.12" radius-top="0.02" height="0.25" color="#ffd700" material="metalness: 0.9; roughness: 0.1"></a-cone>
      <a-cylinder position="-0.25 0.8 0" radius="0.08" height="0.22" color="#ffd700" material="metalness: 0.9; roughness: 0.1"></a-cylinder>
    </a-entity>

    <a-entity id="bue" position="-1.2 0 -3.6" rotation="0 30 0">
      <a-box position="0 0.4 0" width="0.6" height="0.5" depth="1.1" color="#523219"></a-box>
      <a-box position="0 0.7 0.4" width="0.4" height="0.35" depth="0.4" color="#3d2310"></a-box>
    </a-entity>

    <a-entity id="asinello" position="1.2 0 -3.6" rotation="0 -30 0">
      <a-box position="0 0.4 0" width="0.5" height="0.5" depth="1.0" color="#6b7280"></a-box>
      <a-box position="0 0.75 0.35" width="0.32" height="0.35" depth="0.35" color="#4b5563"></a-box>
    </a-entity>

    <a-entity id="rig" position="0 0 1.2">
      <a-camera position="0 1.6 0">
        <a-cursor color="#ffd700" raycaster="objects: .clickable" fuse="false"></a-cursor>
      </a-camera>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
    </a-entity>

  </a-scene>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Presepe Realistico e Moderno VR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('interazione-presepe', {
      init: function () {
        let el = this.el;
        let luce = document.querySelector('#luce-capanna');
        let audio = document.querySelector('#audio-natale');
        el.addEventListener('click', function () {
          if (audio.paused) {
            audio.play();
          } else {
            audio.pause();
          }
          luce.setAttribute('animation', {
            property: 'light.intensity',
            from: 18,
            to: 40,
            dur: 400,
            dir: 'alternate',
            loop: 3
          });
        });
      }
    });

    AFRAME.registerComponent('rotazione-stella', {
      tick: function (t, dt) {
        let rot = this.el.getAttribute('rotation');
        this.el.setAttribute('rotation', {
          x: rot.x,
          y: rot.y + (dt * 0.02),
          z: rot.z
        });
      }
    });
  </script>
</head>
<body>

  <a-scene webxr="optionalFeatures: hit-test">

    <a-assets>
      <audio id="audio-natale" src="https://cdn.freesound.org/previews/518/518872_11270275-lq.mp3" crossorigin="anonymous" preload="auto"></audio>

      <a-asset-item id="modello-stella" src="assets/stella.glb"></a-asset-item>
      <a-asset-item id="modello-gesu" src="assets/gesu.glb"></a-asset-item>
      <a-asset-item id="modello-maria" src="assets/maria.glb"></a-asset-item>
      <a-asset-item id="modello-giuseppe" src="assets/giuseppe.glb"></a-asset-item>
      <a-asset-item id="modello-magio1" src="assets/magio1.glb"></a-asset-item>
      <a-asset-item id="modello-magio2" src="assets/magio2.glb"></a-asset-item>
      <a-asset-item id="modello-magio3" src="assets/magio3.glb"></a-asset-item>
      <a-asset-item id="modello-bue" src="assets/bue.glb"></a-asset-item>
      <a-asset-item id="modello-asinello" src="assets/asinello.glb"></a-asset-item>
    </a-assets>

    <a-sky color="#02040a"></a-sky>

    <a-entity id="stelle">
      <a-sphere position="-15 20 -25" radius="0.08" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="18 24 -20" radius="0.1" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="-10 12 -18" radius="0.06" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="12 16 -15" radius="0.07" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="-22 18 -30" radius="0.12" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="20 15 -28" radius="0.09" color="#ffffff" material="emissive: #ffffff"></a-sphere>
      <a-sphere position="0 28 -35" radius="0.15" color="#ffffff" material="emissive: #ffffff"></a-sphere>
    </a-entity>

    <a-plane position="0 0 0" rotation="-90 0 0" width="80" height="80" color="#050811" material="roughness: 0.9; metalness: 0.1"></a-plane>

    <a-light type="ambient" color="#1a2436" intensity="0.4"></a-light>
    <a-light id="luce-capanna" type="point" color="#ff9e3b" intensity="18" distance="15" position="0 2.5 -3.5"></a-light>
    <a-light type="directional" color="#38bdf8" intensity="0.6" position="-5 12 5"></a-light>

    <a-entity id="stella-cometa" class="clickable" interazione-presepe position="0 5.5 -3.5" animation="property: position; to: 0 5.7 -3.5; dir: alternate; dur: 2200; loop: true">
      <a-gltf-model src="#modello-stella" scale="0.5 0.5 0.5" rotazione-stella></a-gltf-model>
      <a-light type="point" color="#fff1a0" intensity="12" distance="12"></a-light>
    </a-entity>

    <a-entity id="architettura-moderna" position="0 0 -3.5">
      <a-box position="0 0.05 0" width="6" height="0.1" depth="5" color="#111827" material="roughness: 0.2; metalness: 0.8"></a-box>
      <a-box position="-2.9 1.8 0" width="0.1" height="3.5" depth="4.8" color="#1f2937" material="roughness: 0.3; metalness: 0.7"></a-box>
      <a-box position="0 3.5 0" width="6" height="0.1" depth="5" color="#1f2937" material="roughness: 0.3; metalness: 0.7"></a-box>
      <a-box position="0 1.8 -2.4" width="5.8" height="3.4" depth="0.1" color="#0f172a" material="opacity: 0.6; transparent: true; roughness: 0.1; metalness: 0.9"></a-box>
      <a-cylinder position="-2.
